services:
  web:
    build:
      context: .
      dockerfile: src/WebInventory.Web/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - dataprotection-keys:/app/keys
    depends_on:
      db:
        condition: service_healthy
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    environment:
      SERVER_NAME: ${SERVER_NAME:-webinventory.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    depends_on:
      - web
  certbot:
    image: certbot/certbot:v2.11.0
    profiles:
      - tools
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webinventory"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  dataprotection-keys:
  certbot-www:
  letsencrypt:
