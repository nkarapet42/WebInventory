services:
  web:
    build:
      context: .
      dockerfile: src/WebInventory.Web/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      - dataprotection-keys:/app/keys
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
    environment:
      SERVER_NAME: ${SERVER_NAME:-webinventory.duckdns.org}
      ODOO_SERVER_NAME: ${ODOO_SERVER_NAME:-odoo.webinventory.duckdns.org}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      web:
        condition: service_healthy
  certbot:
    image: certbot/certbot:v2.11.0
    profiles:
      - tools
    volumes:
      - certbot-www:/var/www/certbot
      - letsencrypt:/etc/letsencrypt
  db:
    image: postgres:16
    env_file:
      - .env
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webinventory"]
      interval: 10s
      timeout: 5s
      retries: 5
  odoo:
    image: odoo:18
    ports:
      - "127.0.0.1:8069:8069"
    environment:
      HOST: odoo-db
      USER: ${ODOO_DB_USER}
      PASSWORD: ${ODOO_DB_PASSWORD}
    command:
      - odoo
      - --database=${ODOO_DB_NAME}
      - --init=web_inventory_viewer
      - --without-demo=all
      - --proxy-mode
    volumes:
      - odoo-data:/var/lib/odoo
      - ./odoo/addons:/mnt/extra-addons:ro
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"from urllib.request import urlopen; urlopen('http://localhost:8069/web/login', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      odoo-db:
        condition: service_healthy
  odoo-db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${ODOO_DB_NAME}
      POSTGRES_USER: ${ODOO_DB_USER}
      POSTGRES_PASSWORD: ${ODOO_DB_PASSWORD}
    volumes:
      - odoo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ODOO_DB_USER} -d ${ODOO_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  dataprotection-keys:
  certbot-www:
  letsencrypt:
  odoo-data:
  odoo-pgdata:
